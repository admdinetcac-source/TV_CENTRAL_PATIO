<script>
  /* =====================================================
     GOOGLE SHEETS
  ====================================================== */

  const links = [
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vSi_UDaq7w9xHpWu7AtLQsTLksQWSkiMhwkrCITrWBGLyFFKjYcyK2-62OW7DQO17_L2a-BH53rP7O6/pubhtml?gid=383199139&single=true"
  ];

  const INTERVALO_SEGUNDOS = 50;

  const iframe = document.getElementById("visor");
  const keepAlive = document.getElementById("keepAlive");

  let index_Siderperu = 0;

  function cambiarPagina() {

    iframe.src = links[index_Siderperu];

    console.log("Mostrando link:", index_Siderperu);

    index_Siderperu =
      (index_Siderperu + 1) % links.length;
  }

  /* =====================================================
     ANTI-INACTIVIDAD TV LG
  ====================================================== */

  function evitarApagado() {

    keepAlive.style.opacity =
      keepAlive.style.opacity === "0.02"
        ? "0.03"
        : "0.02";

    window.dispatchEvent(new Event("mousemove"));
    window.dispatchEvent(new Event("keydown"));
  }

  // cada 5 minutos
  setInterval(evitarApagado, 5 * 60 * 1000);

  /* =====================================================
     INICIO
  ====================================================== */

  cambiarPagina();

  // recarga automática
  setInterval(() => {
    cambiarPagina();
  }, INTERVALO_SEGUNDOS * 1000);

</script>
