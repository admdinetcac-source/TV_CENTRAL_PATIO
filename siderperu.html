<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Power BI Rotador TV</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <style>

    html, body {
      margin: 0;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* ===== CONTENEDOR GENERAL ===== */

    .contenedor {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* ===== CABECERA ===== */

    .zona-video {
      width: 100%;
      height: 15%;
      background: #072040;

      display: flex;
      align-items: center;

      padding: 0 25px;
      gap: 30px;

      box-sizing: border-box;
    }

    /* ===== VIDEO / LOGO ===== */

    .zona-video video {
      height: 90%;
      width: auto;
      object-fit: contain;
    }

    /* ===== TITULO ===== */

    .titulo-tv {
      color: white;
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    /* ===== POWER BI / GOOGLE SHEETS ===== */

    .zona-web {
      width: 100%;
      height: 85%;
      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ===== PIXEL INVISIBLE ===== */

    #keepAlive {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0.02;
      top: 0;
      left: 0;
    }

  </style>
</head>

<body>

<div class="contenedor">

  <!-- CABECERA -->
  <div class="zona-video">

    <!-- VIDEO / LOGO -->
    <video autoplay muted loop playsinline>
      <source src="VIDEO_TV.mp4" type="video/mp4">
    </video>

    <!-- TITULO -->
    <div class="titulo-tv">
      ESTATUS OPERATIVO SIDER PERU - DINET
    </div>

  </div>

  <!-- GOOGLE SHEETS -->
  <div class="zona-web">
    <iframe id="visor"></iframe>
  </div>

</div>

<!-- PIXEL INVISIBLE -->
<div id="keepAlive"></div>

<script>

  /* =====================================================
     GOOGLE SHEETS
  ====================================================== */

  const links = [
    "https://docs.google.com/spreadsheets/d/e/2PACX-1vSi_UDaq7w9xHpWu7AtLQsTLksQWSkiMhwkrCITrWBGLyFFKjYcyK2-62OW7DQO17_L2a-BH53rP7O6/pubhtml?gid=383199139&single=true"
  ];

  const INTERVALO_SEGUNDOS = 50;

  const iframe = document.getElementById("visor");
  const keepAlive = document.getElementById("keepAlive");

  let siderperu = 0;

  function cambiarPagina() {

    iframe.src = links[siderperu];

    console.log("Mostrando link:", siderperu);

    siderperu =
      (siderperu + 1) % links.length;
  }

  /* =====================================================
     ANTI-INACTIVIDAD TV LG
  ====================================================== */

  function evitarApagado() {

    keepAlive.style.opacity =
      keepAlive.style.opacity === "0.02"
        ? "0.03"
        : "0.02";

    window.dispatchEvent(new Event("mousemove"));
    window.dispatchEvent(new Event("keydown"));
  }

  // cada 5 minutos
  setInterval(evitarApagado, 5 * 60 * 1000);

  /* =====================================================
     INICIO
  ====================================================== */

  cambiarPagina();

  // recarga automática
  setInterval(() => {
    cambiarPagina();
  }, INTERVALO_SEGUNDOS * 1000);

</script>

</body>
</html>
